[project]
name = "knowledge-mapper"
version = "0.1.0"
description = "Saskatchewan post-secondary course and prerequisite knowledge graph"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "httpx>=0.27",
    "aiolimiter>=1.1",
    "lxml>=5.0",
    "typeguard>=4.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devvyn"]
