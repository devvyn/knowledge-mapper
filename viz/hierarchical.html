<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hierarchical Course View</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { text-align: center; color: #4ECDC4; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #8b949e; margin-bottom: 30px; font-size: 0.9em; }

        #controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .control-group {
            background: rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 8px;
        }
        .control-group label { margin-right: 10px; color: #8b949e; }
        select {
            background: #0d1117;
            color: #eee;
            border: 1px solid #30363d;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        #chart { width: 100%; overflow-x: auto; }

        .subject-group {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            margin: 20px auto;
            padding: 20px;
            max-width: 1400px;
        }
        .subject-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #30363d;
        }
        .subject-name {
            font-size: 1.4em;
            font-weight: 600;
            margin-right: 15px;
        }
        .subject-count {
            color: #8b949e;
            font-size: 0.9em;
        }
        .institution-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            margin-left: auto;
        }
        .institution-badge.usask { background: #58a6ff33; color: #58a6ff; }
        .institution-badge.saskpolytech { background: #f0883e33; color: #f0883e; }

        .levels-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 10px 0;
        }
        .level-column {
            min-width: 200px;
            flex-shrink: 0;
        }
        .level-header {
            text-align: center;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: 600;
            color: #8b949e;
        }
        .level-header.level-100 { border-left: 3px solid #3fb950; }
        .level-header.level-200 { border-left: 3px solid #58a6ff; }
        .level-header.level-300 { border-left: 3px solid #a371f7; }
        .level-header.level-400 { border-left: 3px solid #f0883e; }

        .course-card {
            background: #21262d;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .course-card:hover {
            background: #30363d;
            transform: translateX(4px);
        }
        .course-card.highlighted {
            border-left-color: #4ECDC4;
            box-shadow: 0 0 15px rgba(78, 205, 196, 0.3);
        }
        .course-card.prereq-of {
            border-left-color: #f0883e;
            background: #f0883e11;
        }
        .course-card.unlocked-by {
            border-left-color: #3fb950;
            background: #3fb95011;
        }
        .course-code {
            font-weight: 600;
            color: #eee;
            margin-bottom: 4px;
        }
        .course-title {
            font-size: 0.85em;
            color: #8b949e;
            line-height: 1.3;
        }
        .course-meta {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            font-size: 0.75em;
        }
        .course-meta span {
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .prereq-count { color: #f0883e; }
        .unlock-count { color: #3fb950; }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85em;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        #tooltip {
            position: fixed;
            background: #161b22;
            border: 1px solid #30363d;
            padding: 12px;
            border-radius: 8px;
            max-width: 300px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 1000;
            font-size: 0.9em;
        }
        #tooltip.visible { opacity: 1; }
        #tooltip h4 { color: #4ECDC4; margin-bottom: 8px; }
        #tooltip ul { list-style: none; margin-top: 8px; }
        #tooltip li { padding: 2px 0; color: #8b949e; }

        #discovery-bar {
            background: linear-gradient(90deg, #0f3460 0%, #1a1a2e 100%);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #4ECDC4;
            font-size: 0.85em;
            margin: -20px -20px 20px -20px;
        }
        #discovery-bar .stats { color: #94a3b8; }
        #discovery-bar .stats strong { color: #4ECDC4; }
        #discovery-bar nav a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 15px;
            transition: color 0.2s;
        }
        #discovery-bar nav a:hover, #discovery-bar nav a.active { color: #4ECDC4; }
    </style>
</head>
<body>
    <div id="discovery-bar">
        <div class="stats">
            <strong id="stat-courses">...</strong> courses · <strong id="stat-subjects">...</strong> subjects · <strong id="stat-prereqs">...</strong> prerequisites
        </div>
        <nav>
            
            
            <a href="hierarchical.html" class="active">Hierarchy</a>
            <a href="full-explorer.html">Full Graph</a>
            <a href="pathfinder.html">Pathfinder</a>
        </nav>
    </div>
    <h1>Hierarchical Course Map</h1>
    <p class="subtitle">Courses organized by subject and level • Click to see prerequisites & unlocks</p>

    <div id="controls">
        <div class="control-group">
            <label>Institution:</label>
            <select id="institution-filter">
                <option value="all">All Institutions</option>
                <option value="usask">USask Only</option>
                <option value="saskpolytech">SaskPolytech Only</option>
            </select>
        </div>
        <div class="control-group">
            <label>Subject:</label>
            <select id="subject-filter">
                <option value="all">All Subjects</option>
            </select>
        </div>
    </div>

    <div id="chart"></div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-color" style="background: #3fb950;"></div>
            <span>100-level (Intro)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #58a6ff;"></div>
            <span>200-level (Core)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #a371f7;"></div>
            <span>300-level (Advanced)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #f0883e;"></div>
            <span>400-level (Senior)</span>
        </div>
    </div>

    <div id="tooltip"></div>

    <script>
    let graphData = null;
    let selectedCourse = null;

    fetch('graph-data.json')
        .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
        })
        .then(data => {
            // Filter out links referencing missing nodes
            const nodeIds = new Set(data.nodes.map(n => n.id));
            data.links = data.links.filter(l => nodeIds.has(l.source) && nodeIds.has(l.target));
            graphData = data;
            populateFilters();
            render();
        })
        .catch(err => {
            document.getElementById('chart').innerHTML = `
                <div style="text-align:center; padding:40px; color:#f85149;">
                    <h2>Error Loading Data</h2>
                    <p>${err.message}</p>
                    <p style="color:#8b949e;">Make sure graph-data.json exists in the viz folder.</p>
                </div>`;
        });

    function populateFilters() {
        const subjects = new Set();
        graphData.nodes
            .filter(n => n.type === 'course')
            .forEach(n => subjects.add(n.subject));

        const select = document.getElementById('subject-filter');
        [...subjects].sort().forEach(subj => {
            const opt = document.createElement('option');
            opt.value = subj;
            opt.textContent = subj;
            select.appendChild(opt);
        });
    }

    function getLevel(code) {
        const match = code.match(/\d+/);
        if (!match) return 100;
        const num = parseInt(match[0]);
        if (num >= 400) return 400;
        if (num >= 300) return 300;
        if (num >= 200) return 200;
        return 100;
    }

    function getPrereqs(courseId) {
        return graphData.links
            .filter(l => l.type === 'prerequisite' &&
                (typeof l.target === 'object' ? l.target.id : l.target) === courseId)
            .map(l => typeof l.source === 'object' ? l.source.id : l.source);
    }

    function getUnlocks(courseId) {
        return graphData.links
            .filter(l => l.type === 'prerequisite' &&
                (typeof l.source === 'object' ? l.source.id : l.source) === courseId)
            .map(l => typeof l.target === 'object' ? l.target.id : l.target);
    }

    function render() {
        const instFilter = document.getElementById('institution-filter').value;
        const subjFilter = document.getElementById('subject-filter').value;

        // Filter courses
        let courses = graphData.nodes.filter(n => n.type === 'course');
        if (instFilter !== 'all') {
            courses = courses.filter(c => c.institution === instFilter);
        }
        if (subjFilter !== 'all') {
            courses = courses.filter(c => c.subject === subjFilter);
        }

        // Group by subject
        const bySubject = {};
        courses.forEach(c => {
            if (!bySubject[c.subject]) bySubject[c.subject] = [];
            bySubject[c.subject].push(c);
        });

        // Render
        const chart = document.getElementById('chart');
        chart.innerHTML = '';

        Object.keys(bySubject).sort().forEach(subject => {
            const subjectCourses = bySubject[subject];
            const institution = subjectCourses[0]?.institution || 'unknown';

            const group = document.createElement('div');
            group.className = 'subject-group';

            // Header
            const header = document.createElement('div');
            header.className = 'subject-header';
            header.innerHTML = `
                <span class="subject-name">${subject}</span>
                <span class="subject-count">${subjectCourses.length} courses</span>
                <span class="institution-badge ${institution}">${institution}</span>
            `;
            group.appendChild(header);

            // Levels container
            const levelsContainer = document.createElement('div');
            levelsContainer.className = 'levels-container';

            // Group by level
            const byLevel = {100: [], 200: [], 300: [], 400: []};
            subjectCourses.forEach(c => {
                const level = getLevel(c.label);
                byLevel[level].push(c);
            });

            [100, 200, 300, 400].forEach(level => {
                if (byLevel[level].length === 0) return;

                const column = document.createElement('div');
                column.className = 'level-column';

                const levelHeader = document.createElement('div');
                levelHeader.className = `level-header level-${level}`;
                levelHeader.textContent = `${level}-Level`;
                column.appendChild(levelHeader);

                byLevel[level]
                    .sort((a, b) => a.label.localeCompare(b.label))
                    .forEach(course => {
                        const card = createCourseCard(course);
                        column.appendChild(card);
                    });

                levelsContainer.appendChild(column);
            });

            group.appendChild(levelsContainer);
            chart.appendChild(group);
        });
    }

    function createCourseCard(course) {
        const card = document.createElement('div');
        card.className = 'course-card';
        card.dataset.id = course.id;

        const prereqs = getPrereqs(course.id);
        const unlocks = getUnlocks(course.id);

        card.innerHTML = `
            <div class="course-code">${course.label}</div>
            <div class="course-title">${course.title || ''}</div>
            <div class="course-meta">
                ${prereqs.length ? `<span class="prereq-count">← ${prereqs.length} prereq${prereqs.length > 1 ? 's' : ''}</span>` : ''}
                ${unlocks.length ? `<span class="unlock-count">→ ${unlocks.length} unlock${unlocks.length > 1 ? 's' : ''}</span>` : ''}
            </div>
        `;

        card.addEventListener('click', () => selectCourse(course));
        card.addEventListener('mouseenter', (e) => showTooltip(e, course, prereqs, unlocks));
        card.addEventListener('mouseleave', hideTooltip);

        return card;
    }

    function selectCourse(course) {
        // Clear previous selection
        document.querySelectorAll('.course-card').forEach(c => {
            c.classList.remove('highlighted', 'prereq-of', 'unlocked-by');
        });

        if (selectedCourse === course.id) {
            selectedCourse = null;
            return;
        }

        selectedCourse = course.id;

        // Highlight selected
        const selectedCard = document.querySelector(`[data-id="${course.id}"]`);
        if (selectedCard) selectedCard.classList.add('highlighted');

        // Highlight prerequisites
        getPrereqs(course.id).forEach(prereqId => {
            const card = document.querySelector(`[data-id="${prereqId}"]`);
            if (card) card.classList.add('prereq-of');
        });

        // Highlight unlocks
        getUnlocks(course.id).forEach(unlockId => {
            const card = document.querySelector(`[data-id="${unlockId}"]`);
            if (card) card.classList.add('unlocked-by');
        });
    }

    function showTooltip(event, course, prereqs, unlocks) {
        const tooltip = document.getElementById('tooltip');

        let html = `<h4>${course.label}</h4>`;
        if (course.title) html += `<p>${course.title}</p>`;

        if (prereqs.length) {
            html += `<p style="margin-top: 10px; color: #f0883e;"><strong>Prerequisites:</strong></p><ul>`;
            prereqs.forEach(p => {
                const node = graphData.nodes.find(n => n.id === p);
                html += `<li>${node?.label || p}</li>`;
            });
            html += '</ul>';
        }

        if (unlocks.length) {
            html += `<p style="margin-top: 10px; color: #3fb950;"><strong>Unlocks:</strong></p><ul>`;
            unlocks.slice(0, 5).forEach(u => {
                const node = graphData.nodes.find(n => n.id === u);
                html += `<li>${node?.label || u}</li>`;
            });
            if (unlocks.length > 5) html += `<li>... and ${unlocks.length - 5} more</li>`;
            html += '</ul>';
        }

        tooltip.innerHTML = html;
        tooltip.style.left = (event.pageX + 15) + 'px';
        tooltip.style.top = (event.pageY + 15) + 'px';
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        document.getElementById('tooltip').classList.remove('visible');
    }

    // Filter handlers
    document.getElementById('institution-filter').addEventListener('change', render);
    document.getElementById('subject-filter').addEventListener('change', render);

    // Fetch discovery stats from API
    (async function loadDiscoveryStats() {
        try {
            const stats = await fetch('http://127.0.0.1:5050/api/stats').then(r => r.json());
            document.getElementById('stat-courses').textContent = stats.courses;
            document.getElementById('stat-subjects').textContent = stats.subjects;
            document.getElementById('stat-prereqs').textContent = stats.prerequisites;
        } catch (e) {
            document.querySelector('#discovery-bar .stats').innerHTML =
                '<em>API offline</em> · Using cached graph data';
        }
    })();
    </script>
</body>
</html>
